name: Safe dependency verification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'requirements.txt'
      - '.github/workflows/**'

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify narrow dependency-only diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          author="$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${PR}" --jq '.user.login')"
          [ "$author" = 'dependabot[bot]' ] || { echo "Refusing non-Dependabot PR: $author"; exit 1; }
          gh api "/repos/${GITHUB_REPOSITORY}/pulls/${PR}/files?per_page=100" > /tmp/files.json
          python - <<'PY'
          import json,re
          fs=json.load(open('/tmp/files.json',encoding='utf-8'))
          if not fs:
              raise SystemExit('empty Dependabot diff')
          allowed=True
          reasons=[]
          for f in fs:
              name=f.get('filename','')
              patch=f.get('patch') or ''
              if name=='requirements.txt':
                  continue
              if name.startswith('.github/workflows/') and name.endswith(('.yml','.yaml')):
                  changed=[ln[1:].strip() for ln in patch.splitlines() if ln.startswith(('+','-')) and not ln.startswith(('+++','---'))]
                  for ln in changed:
                      if not ln:
                          continue
                      if not re.fullmatch(r'(?:-\s*)?uses:\s*(?:actions|github)/[A-Za-z0-9_.-]+@[A-Za-z0-9_.-]+',ln):
                          allowed=False
                          reasons.append(f'{name}: non-version workflow change: {ln[:120]}')
                  continue
              allowed=False
              reasons.append(f'unapproved file: {name}')
          print('\n'.join(reasons))
          if not allowed:
              raise SystemExit('Dependabot diff exceeds safe dependency verification policy')
          print('Safe dependency verification passed; merge still requires user approval.')
          PY
