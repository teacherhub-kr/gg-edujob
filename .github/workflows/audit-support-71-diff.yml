name: Audit support-office identity diff

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/audit_support_71_diff.py'
      - 'scripts/audit_m0_maintenance_freeze.py'
      - 'scripts/support_page_evidence.py'
      - 'scripts/support_reviewed_binary_evidence.py'
      - 'scripts/stable_source_identity.py'
      - 'scripts/support_population_contract.py'
      - 'tests/test_audit_support_diff.py'
      - 'tests/test_support_page_evidence.py'
      - 'tests/fixtures/support_evidence/**'
      - 'tests/test_stable_source_identity.py'
      - 'requirements.txt'
      - '.github/workflows/audit-support-71-diff.yml'
permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install audit parser dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run identity and classification regressions
        run: python -m unittest tests.test_audit_support_diff tests.test_support_page_evidence -v
      - name: Keep M0 automatic state changes frozen
        run: python scripts/audit_m0_maintenance_freeze.py
      - name: Audit current historical/current identity diff
        run: python scripts/audit_support_71_diff.py --output "$RUNNER_TEMP/support_diff_audit.json"
      - name: Upload read-only audit evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: support-diff-audit
          path: ${{ runner.temp }}/support_diff_audit.json
          if-no-files-found: warn
          retention-days: 14
