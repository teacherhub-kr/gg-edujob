name: P0 Incheon official source regression

on:
  pull_request:
    paths:
      - 'scripts/merge_incheon_official.py'
      - 'scripts/collect_incheon_support.py'
      - 'scripts/ensure_incheon_registry.py'
      - 'scripts/verify_required_regions.py'
      - 'scripts/stable_source_identity.py'
      - 'scripts/reconcile_source_ids.py'
      - 'scripts/update_collector_status.py'
      - 'scripts/verify_central_reconciliation_consistency.py'
      - 'scripts/verify_support_completeness.py'
      - 'scripts/validate_reconciliation_policy_v3.py'
      - 'scripts/verify_jobs.py'
      - '.github/workflows/update-jobs.yml'
      - '.github/workflows/recover-missing-jobs.yml'
      - '.github/workflows/p0-incheon-regression.yml'
      - '.github/workflows/official-completeness-audit.yml'
      - 'tests/test_incheon_transient_retry.py'
      - 'tests/test_incheon_support_offices.py'
      - 'tests/test_verify_jobs_incheon_support.py'
      - 'tests/test_collector_status_identity_binding.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-incheon:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install collector dependencies
        run: pip install -r requirements.txt
      - name: Static compile
        run: |
          python -m py_compile scripts/merge_incheon_official.py scripts/collect_incheon_support.py scripts/ensure_incheon_registry.py scripts/verify_required_regions.py scripts/stable_source_identity.py scripts/reconcile_source_ids.py scripts/update_collector_status.py scripts/verify_central_reconciliation_consistency.py scripts/verify_support_completeness.py scripts/validate_reconciliation_policy_v3.py scripts/verify_jobs.py
      - name: Verify narrow Incheon transient retry contract
        env:
          PYTHONPATH: scripts
        run: python -m unittest tests.test_incheon_transient_retry tests.test_incheon_support_offices tests.test_verify_jobs_incheon_support tests.test_collector_status_identity_binding
      - name: Verify Fast and recovery are registry-aware and do not patch source code
        run: |
          python - <<'PY'
          from pathlib import Path
          recovery=Path('.github/workflows/recover-missing-jobs.yml').read_text(encoding='utf-8')
          fast=Path('.github/workflows/update-jobs.yml').read_text(encoding='utf-8')
          assert 'from source_registry import official_source_count' in recovery
          assert 'total != 38' not in recovery
          assert 'Not all 38 official sources' not in recovery
          expected_incheon_retry='python scripts/merge_incheon_official.py --lookback-days 90 --transient-retries 2 --retry-delay-seconds 15'
          assert expected_incheon_retry in recovery
          assert expected_incheon_retry in fast
          forbidden=('hotfix_sources.py','hotfix_repair_links.py','harden_fast_pagination.py','harden_deep_audit.py','harden_network_retries.py','harden_central_pagination.py','harden_gyeonggi_central_retention.py')
          for name,text in (('recovery',recovery),('fast',fast)):
              for hardener in forbidden:
                  assert f'python scripts/{hardener}' not in text,(name,hardener)
              for line in text.splitlines():
                  stripped=line.strip()
                  if stripped.startswith('git add '):
                      assert 'scripts/' not in stripped,(name,stripped)
          assert 'python scripts/ensure_incheon_registry.py' in fast
          assert 'sources.json' in fast
          assert "grep -q 'RETRY_POLICY = Retry' scripts/scrape_jobs.py" not in fast
          assert "grep -q 'consecutive_old_pages >= 2' scripts/scrape_jobs.py" not in fast
          assert "grep -q 'if registered and not recent_enough(registered, 90)' scripts/scrape_jobs.py" not in fast
          assert "grep -q 'official_source_count' scripts/reconcile_source_ids.py" not in fast
          assert '/tmp/fast_reconciliation_completed_epoch' in fast
          assert 'age_seconds' in fast
          assert '[ "$age_seconds" -le 600 ]' in fast
          assert 'Reconciliation proof missing/stale; performing full pre-publication re-read.' in fast
          print('Fast/recovery transition safety ok')
          PY
      - name: Materialize three-region registry in the test checkout
        run: python scripts/ensure_incheon_registry.py
      - name: Verify registry coverage and strong identities
        env:
          PYTHONPATH: scripts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from source_registry import official_source_count
          from stable_source_identity import canonical_source_id
          data=json.loads(Path('sources.json').read_text(encoding='utf-8'))
          assert {'gyeonggi','seoul','incheon'} <= set(data),data.keys()
          assert official_source_count() == 44,official_source_count()
          boards=(data['incheon']['central'].get('requiredBoards') or [])
          by_bbs={str(x.get('bbsId')):str(x.get('url')) for x in boards}
          assert by_bbs == {'1981':'https://www.ice.go.kr/ice/na/ntt/selectNttList.do?bbsId=1981&mi=10997','1534':'https://www.ice.go.kr/afterschool/na/ntt/selectNttList.do?bbsId=1534&mi=10571'},by_bbs
          central={'province':'인천','sourceType':'통합게시판','bbsId':'1981','nttSn':'3384652','url':'https://www.ice.go.kr/ice/na/ntt/selectNttInfo.do?bbsId=1981&mi=10997&nttSn=3384652'}
          afterschool={'province':'인천','sourceType':'늘봄지원센터','bbsId':'1534','nttSn':'3384314','url':'https://www.ice.go.kr/afterschool/na/ntt/selectNttInfo.do?bbsId=1534&mi=10571&nttSn=3384314'}
          assert canonical_source_id(central) == 'ice-central:3384652'
          assert canonical_source_id(afterschool) == 'ice-afterschool:3384314'
          support=(data['incheon'].get('supportOffices') or [])
          assert len(support) == 5,support
          assert {x.get('key') for x in support} == {'nambu','bukbu','dongbu','seobu','ganghwa'},support
          north={'province':'인천','sourceType':'교육지원청 개별 게시판','url':'https://bukbu.ice.go.kr/bbs/data/view.do?bbs_mst_idx=BM0000000049&data_idx=BD0000008173&menu_idx=86'}
          east={'province':'인천','sourceType':'교육지원청 개별 게시판','url':'https://dongbu.ice.go.kr/bbs/bbsMsgDetail.do?bcd=job_offer&msg_seq=6928'}
          assert canonical_source_id(north) == 'ice-support:bukbu.ice.go.kr:data_idx:BD0000008173'
          assert canonical_source_id(east) == 'ice-support:dongbu.ice.go.kr:msg_seq:6928'
          print('registry/identity ok',by_bbs,[x.get('name') for x in support])
          PY
      - name: Probe complete live Incheon official network
        env:
          PYTHONPATH: scripts
        run: |
          # Use the production collector path as the live contract. A raw HTML/CSS
          # diagnostic probe is intentionally not a merge gate because official sites
          # can vary markup or bot handling while the collector remains healthy.
          # Probe support offices first so a transient central-board outage never
          # hides support-office diagnostics. Both gates are still mandatory.
          python scripts/collect_incheon_support.py --check-only --lookback-days 14 --max-pages 10
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('incheon_support_report.json').read_text(encoding='utf-8'))
          assert report.get('officeCount') == 5,report
          assert report.get('completeOffices') == 5,report
          assert {x.get('name') for x in report.get('offices',[])} == {
              '인천남부교육지원청','인천북부교육지원청','인천동부교육지원청','인천서부교육지원청','인천강화교육지원청'
          },report
          print('five-office live probe ok',[(x.get('name'),x.get('count'),x.get('pagesScanned')) for x in report.get('offices',[])])
          PY
          python scripts/merge_incheon_official.py --check-only --lookback-days 14 --max-pages 3
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('incheon_official_report.json').read_text(encoding='utf-8'))
          health=report.get('boardHealth') or []
          assert report.get('coverageComplete') is True,report
          assert len(health) == 2,health
          assert {str(x.get('bbsId')) for x in health if x.get('coverageComplete') is True} == {'1981','1534'},health
          assert all(int(x.get('count') or 0) > 0 for x in health),health
          print('two-board live probe ok',[(x.get('bbsId'),x.get('count'),x.get('pagesScanned'),x.get('stopReason')) for x in health])
          PY
