# One-time, PR-only read-only audit; never merge this workflow into main.
name: One-time official posting URL recovery audit (2026-11-20)
on:
  pull_request:
    paths:
      - '.github/workflows/audit-current-official-23-20261120.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Compare immutable latest main Regional and Unified canonical URLs
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          python - <<'PY'
          import collections
          from datetime import datetime
          import json
          import subprocess
          from urllib.parse import urlsplit, parse_qs
          from zoneinfo import ZoneInfo

          candidates = """\
          sen-114237|2026-11-20|https://work.sen.go.kr/work/search/recInfo/BD_selectRecDetail.do?q_rcrtSn=114237
          sen-114326|2026-11-19|https://work.sen.go.kr/work/search/recInfo/BD_selectRecDetail.do?q_rcrtSn=114326
          goe-office-0f20f862ce8ad4b3cecc|2026-11-19|https://www.goegm.kr/goegm/na/ntt/selectNttInfo.do?bbsId=4225&mi=5826&nttSn=1263030
          goe-office-bab96c4e93ac19c62512|2026-11-18|https://www.goepj.kr/goepj/na/ntt/selectNttInfo.do?bbsId=7202&mi=10838&nttSn=1359397
          goe-office-27cb66e9a47bcd9a7698|2026-11-17|https://www.goept.kr/goept/na/ntt/selectNttInfo.do?bbsId=10111&mi=10118&nttSn=2577939
          goe-office-e9fae5955815d5dd6086|2026-11-16|https://www.goegn.kr/goegn/na/ntt/selectNttInfo.do?bbsId=8653&mi=16003&nttSn=1418664
          sen-114216|2026-12-07|https://work.sen.go.kr/work/search/recInfo/BD_selectRecDetail.do?q_rcrtSn=114216
          sen-office-gdspedu.sen.go.kr-8371|2026-11-27|https://gdspedu.sen.go.kr/FUS/JO/JOV11.do?job_seq=8371
          sen-114155|2026-11-26|https://work.sen.go.kr/work/search/recInfo/BD_selectRecDetail.do?q_rcrtSn=114155
          sen-114196|2026-11-20|https://work.sen.go.kr/work/search/recInfo/BD_selectRecDetail.do?q_rcrtSn=114196
          sen-114063|2026-11-20|https://work.sen.go.kr/work/search/recInfo/BD_selectRecDetail.do?q_rcrtSn=114063
          sen-114180|2026-11-20|https://work.sen.go.kr/work/search/recInfo/BD_selectRecDetail.do?q_rcrtSn=114180
          sen-114192|2026-11-19|https://work.sen.go.kr/work/search/recInfo/BD_selectRecDetail.do?q_rcrtSn=114192
          sen-114224|2026-11-18|https://work.sen.go.kr/work/search/recInfo/BD_selectRecDetail.do?q_rcrtSn=114224
          sen-114164|2026-11-18|https://work.sen.go.kr/work/search/recInfo/BD_selectRecDetail.do?q_rcrtSn=114164
          goe-office2-41f1fe56ecee57edaf|2026-12-05|https://www.goesn.kr/goesn/na/ntt/selectNttInfo.do?bbsId=17872&mi=23603&nttSn=1968243
          sen-114108|2026-11-16|https://work.sen.go.kr/work/search/recInfo/BD_selectRecDetail.do?q_rcrtSn=114108
          sen-113892|2026-11-16|https://work.sen.go.kr/work/search/recInfo/BD_selectRecDetail.do?q_rcrtSn=113892
          goe-65156|2026-11-30|https://www.goe.go.kr/recruit/ad/func/pb/hnfpPbancInfoView.do?mi=10502&pbancSn=65156
          sen-113663|2026-12-04|https://work.sen.go.kr/work/search/recInfo/BD_selectRecDetail.do?q_rcrtSn=113663
          sen-office-gdspedu.sen.go.kr-8340|2026-12-01|https://gdspedu.sen.go.kr/FUS/JO/JOV11.do?job_seq=8340
          sen-113240|2026-12-18|https://work.sen.go.kr/work/search/recInfo/BD_selectRecDetail.do?q_rcrtSn=113240
          sen-112917|2026-11-16|https://work.sen.go.kr/work/search/recInfo/BD_selectRecDetail.do?q_rcrtSn=112917
          """
          rows = [line.strip().split("|",2) for line in candidates.splitlines() if line.strip()]
          assert len(rows)==23 and len({r[0] for r in rows})==23
          def read_main(path):
              obj=json.loads(subprocess.check_output(["git","show",f"origin/main:{path}"]))
              assert isinstance(obj,dict) and isinstance(obj.get("jobs"),list),path
              return obj["jobs"]
          regional=read_main("seoul_gyeonggi_jobs.json")
          all_unified=read_main("unified_jobs.json")
          official=[x for x in all_unified if x.get("feedKind")=="official"]
          def key(url):
              if not url:return None
              p=urlsplit(str(url).strip())
              if not p.hostname or not p.path:return None
              host=p.hostname.lower().removeprefix("www.")
              qs=parse_qs(p.query,keep_blank_values=False)
              for name in ("q_rcrtSn","nttSn","pbancSn","job_seq"):
                  if qs.get(name):
                      return (host,p.path.lower(),name.lower(),str(qs[name][0]))
              return None
          def index(items):
              out=collections.defaultdict(list)
              for row in items:
                  for col in ("url","originalUrl","verifiedUrl","openUrl","detailUrl","directUrl"):
                      k=key(row.get(col))
                      if k:out[k].append(row)
              return out
          reg=index(regional); uni=index(official)
          sha=subprocess.check_output(["git","rev-parse","origin/main"],text=True).strip()
          day=datetime.now(ZoneInfo("Asia/Seoul")).date().isoformat()
          totals=collections.Counter()
          urgent=[]
          print("MAIN_SHA",sha)
          print("AUDIT_KST_DATE",day)
          print("COUNTS",len(regional),len(all_unified),len(official))
          print("IMPORTANT: current live official-list membership is NOT tested; deadline dates are historical snapshots, NOT live confirmation.")
          print("candidate | recordedDeadline | historicalDeadlineClass | rawRegional | unifiedOfficial | state")
          for identifier,deadline,url in rows:
              k=key(url)
              assert k is not None,(identifier,url)
              rc=len(reg.get(k,[]));uc=len(uni.get(k,[]))
              cls="past" if deadline<day else ("today" if deadline==day else "future")
              state="both" if rc and uc else "raw-only" if rc else "unified-only" if uc else "absent-both"
              totals[state]+=1
              totals[cls+"_"+state]+=1
              if state!="both" and cls in {"today","future"}:urgent.append((identifier,deadline,url))
              print(identifier,"|",deadline,"|",cls,"|",rc,"|",uc,"|",state,flush=True)
          print("SUMMARY",json.dumps(dict(totals),ensure_ascii=False,sort_keys=True))
          print("HIGH_PRIORITY_HISTORICAL_DEADLINE_CANDIDATES",json.dumps(urgent,ensure_ascii=False))
          print("No P0 verdict without independent current official-list source ID + actual live deadline. Never auto-restore missing URLs.")
          PY

      - name: Probe Seoul central official-list native IDs independently (read only, inconclusive on denial)
        run: |
          python - <<'PY'
          import hashlib
          import json
          import re
          import time
          from urllib.parse import urlsplit, urlunsplit, parse_qsl, urlencode
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError

          registry=json.load(open("sources.json",encoding="utf-8"))
          base=registry["seoul"]["central"]["url"]
          assert urlsplit(base).hostname=="work.sen.go.kr"
          targets={"114237","114216","114155","114196","114063","114180","113663","113240"}
          # Source-native list IDs, NOT detail URL 200. No cookies, auth, bypass,
          # credentials, third-party probes, or publication writes.
          seen={}
          digests=set()
          failures=[]
          terminal="limit"
          for page in range(1,19):
              p=urlsplit(base)
              q=dict(parse_qsl(p.query))
              q.update({"type":"term","q_currPage":str(page),
                        "q_rowPerPage":"50","q_sortBy":"regDt","q_recClosed":"closed"})
              url=urlunsplit((p.scheme,p.netloc,p.path,urlencode(q),""))
              req=Request(url,headers={"User-Agent":"gg-edujob-source-audit/1.0 (+https://github.com/teacherhub-kr/gg-edujob)",
                                       "Accept":"text/html"})
              try:
                  with urlopen(req,timeout=12) as res:
                      code=res.status
                      body=res.read(1000000).decode("utf-8","replace")
                      final_host=urlsplit(res.url).hostname
                  if code!=200 or final_host!="work.sen.go.kr":
                      raise ValueError("HTTP/status or host mismatch")
              except (HTTPError,URLError,TimeoutError,OSError,ValueError) as e:
                  failures.append(f"page={page}:{type(e).__name__}")
                  terminal="access-or-transport-error"
                  break
              ids=list(dict.fromkeys(re.findall(r"BD_selectRecDetail\.do\?q_rcrtSn=(\d+)",body)))
              digest=hashlib.sha256(",".join(ids).encode()).hexdigest()[:12]
              print("LIVE_PAGE",page,"http",code,"nativeIds",len(ids),"digest",digest,flush=True)
              if not ids:
                  terminal="empty-or-unparseable"
                  break
              if digest in digests:
                  terminal="page-replay"
                  break
              digests.add(digest)
              for sid in ids:
                  seen.setdefault(sid,page)
              if len(ids)<50:
                  terminal="short-page"
                  break
              time.sleep(0.5)
          print("LIVE_SEOUL_TARGETS",json.dumps({sid:{"foundOnList":sid in seen,"page":seen.get(sid)}
                                                    for sid in sorted(targets)},sort_keys=True))
          print("LIVE_SEOUL_TRAVERSAL",json.dumps({"pagesUnique":len(digests),"nativeIds":len(seen),
                         "terminal":terminal,"failures":failures},ensure_ascii=False))
          print("Live list-ID presence is positive evidence; absence is not proven without full, source-independent traversal and current deadline.")
          PY

      - name: Inspect the live listed 113663 row and recorded application period (read only)
        run: |
          python - <<'PY'
          import html
          import json
          import re
          from urllib.parse import urlsplit,urlunsplit,parse_qsl,urlencode
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError,URLError
          base=json.load(open("sources.json",encoding="utf-8"))["seoul"]["central"]["url"]
          p=urlsplit(base)
          assert p.hostname=="work.sen.go.kr"
          q=dict(parse_qsl(p.query))
          q.update({"type":"term","q_currPage":"8","q_rowPerPage":"50","q_sortBy":"regDt","q_recClosed":"closed"})
          u=urlunsplit((p.scheme,p.netloc,p.path,urlencode(q),""))
          req=Request(u,headers={"User-Agent":"gg-edujob-source-audit/1.0 (+https://github.com/teacherhub-kr/gg-edujob)","Accept":"text/html"})
          try:
              with urlopen(req,timeout=12) as r:
                  body=r.read(1000000).decode("utf-8","replace")
                  assert r.status==200 and urlsplit(r.url).hostname=="work.sen.go.kr"
          except (HTTPError,URLError,TimeoutError,OSError,AssertionError) as e:
              print("NATIVE_113663_ROW inconclusive",type(e).__name__)
              raise SystemExit(0)
          marker="BD_selectRecDetail.do?q_rcrtSn=113663"
          pos=body.find(marker)
          if pos<0:
              print("NATIVE_113663_ROW not-present-on-page-8; live listing may have changed")
              raise SystemExit(0)
          start=body.rfind("<li",0,pos)
          end=body.find("</li>",pos)
          if start<0 or end<0 or end-start>25000:
              print("NATIVE_113663_ROW present-but-card-boundary-not-parsed")
              raise SystemExit(0)
          card=body[start:end+5]
          card=re.sub(r"(?is)<script[^>]*>.*?</script>"," ",card)
          card=re.sub(r"(?s)<[^>]*>"," ",card)
          card=html.unescape(re.sub(r"\s+"," ",card)).strip()
          # Source-list text only: no applicant or confidential data.
          print("NATIVE_113663_LIVE_ROW_TEXT",card[:1100])
          print("NATIVE_113663_LIVE_DATES",re.findall(r"20\d{2}[./-]\d{1,2}[./-]\d{1,2}",card)[:10])
          PY
