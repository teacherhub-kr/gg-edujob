name: Diagnose support-office link structures

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: metro-edujob-link-diagnostics
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Snapshot official support-office link structures
        run: python scripts/diagnose_support_links.py
      - name: Upload diagnostics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: support-link-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: support_link_diagnostics.json
          if-no-files-found: error
          retention-days: 14
