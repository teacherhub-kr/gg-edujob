name: Dependency CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'requirements.txt'
      - '.github/workflows/**'

permissions:
  contents: read
  pull-requests: read

jobs:
  scope:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify narrow dependency-only diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          author="$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${PR}" --jq '.user.login')"
          [ "$author" = 'dependabot[bot]' ] || { echo "Refusing non-Dependabot PR: $author"; exit 1; }
          gh api "/repos/${GITHUB_REPOSITORY}/pulls/${PR}/files?per_page=100" > /tmp/files.json
          python - <<'PY'
          import json,re
          fs=json.load(open('/tmp/files.json',encoding='utf-8'))
          if not fs:
              raise SystemExit('empty Dependabot diff')
          allowed=True
          reasons=[]
          for f in fs:
              name=f.get('filename','')
              patch=f.get('patch') or ''
              if name=='requirements.txt':
                  continue
              if name.startswith('.github/workflows/') and name.endswith(('.yml','.yaml')):
                  changed=[ln[1:].strip() for ln in patch.splitlines() if ln.startswith(('+','-')) and not ln.startswith(('+++','---'))]
                  for ln in changed:
                      if not ln:
                          continue
                      if not re.fullmatch(r'(?:-\s*)?uses:\s*(?:actions|github)/[A-Za-z0-9_.-]+@[A-Za-z0-9_.-]+',ln):
                          allowed=False
                          reasons.append(f'{name}: non-version workflow change: {ln[:120]}')
                  continue
              allowed=False
              reasons.append(f'unapproved file: {name}')
          print('\n'.join(reasons))
          if not allowed:
              raise SystemExit('Dependabot diff exceeds safe dependency verification policy')
          print('Safe dependency verification passed; merge still requires user approval.')
          PY

  verify:
    if: github.actor == 'dependabot[bot]'
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install proposed Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt playwright
      - name: Run repository unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Compile collector and audit scripts
        run: python -m compileall -q scripts
      - name: Verify current official reconciliation policy
        run: python scripts/validate_reconciliation_policy.py
      - name: Rebuild disposable unified search with proposed dependencies
        run: |
          python scripts/build_unified_search.py --output /tmp/unified_candidate.json --report /tmp/unified_build_report.json
          python scripts/validate_unified_search.py --file /tmp/unified_candidate.json --report /tmp/unified_validation_report.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/unified_validation_report.json',encoding='utf-8'))
          assert r.get('healthy') is True, r
          assert int(r.get('missingLessoninfoIds') or 0)==0, r
          assert int(r.get('missingLinks') or 0)==0, r
          print('dependency candidate preserved unified search integrity')
          PY
