name: Foundation targeted read-only diagnostics

on:
  pull_request:
    paths:
      - '.github/workflows/foundation-targeted-diagnostics.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install diagnostics dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Inspect exact hard-site contracts
        run: |
          python - <<'PY'
          import json,re,requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          H={"User-Agent":"Mozilla/5.0"}

          def clean(x): return " ".join(str(x or "").split())
          def contexts(raw, needle, radius=1200, limit=8):
            out=[]
            pos=0
            while len(out)<limit:
              i=raw.find(needle,pos)
              if i<0: break
              out.append(clean(raw[max(0,i-radius):i+radius]))
              pos=i+len(needle)
            return out

          # Shared Vue boards: expose exact search endpoint and category contract.
          for url in ["https://www.gdfac.or.kr/community/ko/notice","https://www.caci.or.kr/community/ko/notice"]:
            r=requests.get(url,headers=H,timeout=25); r.encoding=r.apparent_encoding or r.encoding
            print("\n===== VUE",url,r.status_code,len(r.content))
            for needle in ["getSearchResults","searchByCategory","axios.","CategoryID"]:
              print("VUECTX",needle,json.dumps(contexts(r.text,needle),ensure_ascii=False))

          # ApplyIn: expose route/API strings around recruiting list.
          url="https://seochocf.applyin.co.kr/"
          r=requests.get(url,headers=H,timeout=25); r.encoding=r.apparent_encoding or r.encoding
          soup=BeautifulSoup(r.text,"html.parser")
          for src in [s.get("src") for s in soup.find_all("script") if s.get("src")][:4]:
            js=requests.get(urljoin(url,src),headers=H,timeout=25).text
            print("\n===== APPLYIN",src,len(js))
            for needle in ["/recruiting/recruiting-list","RecruitingList","fetchRecruitResource","axios.get","/api/","recruits"]:
              print("APPLYCTX",needle,json.dumps(contexts(js,needle,1800,10),ensure_ascii=False))

          # Jungnang Next.js: print complete job_posting block(s) and nearby values.
          url="https://recruit.jnfac.or.kr/recruit"
          r=requests.get(url,headers=H,timeout=25); r.encoding=r.apparent_encoding or r.encoding
          soup=BeautifulSoup(r.text,"html.parser")
          nd=soup.find("script",id="__NEXT_DATA__")
          if nd and nd.string:
            data=json.loads(nd.string)
            blocks=[]
            def walk(v,path=""):
              if isinstance(v,dict):
                if v.get("type")=="job_posting":
                  blocks.append((path,v))
                for k,x in v.items(): walk(x,path+"/"+str(k))
              elif isinstance(v,list):
                for i,x in enumerate(v): walk(x,path+"/"+str(i))
            walk(data)
            print("\n===== JNFAC JOB BLOCKS",json.dumps(blocks,ensure_ascii=False)[:30000])

          # Dobong AJAX: exact content rows / view ids.
          url="https://www.dbfac.or.kr/front/board/boardContentsListPage.do?board_id=7"
          r=requests.get(url,headers=H,timeout=25); r.encoding=r.apparent_encoding or r.encoding
          soup=BeautifulSoup(r.text,"html.parser")
          form=soup.find("form",id="listFrm") or soup.find("form")
          data={}
          if form:
            for inp in form.find_all(["input","select"]):
              n=inp.get("name")
              if not n: continue
              if inp.name=="select":
                opt=inp.find("option",selected=True) or inp.find("option")
                data[n]=opt.get("value","") if opt else ""
              else:
                data[n]=inp.get("value","")
          data.update({"board_id":"7","miv_pageNo":"1","miv_pageSize":"30"})
          rr=requests.post("https://www.dbfac.or.kr/front/board/boardContentsList.do",headers=H,data=data,timeout=25)
          rr.encoding=rr.apparent_encoding or rr.encoding
          print("\n===== DBFAC",rr.status_code,len(rr.content))
          print("DBFAC_CONTENTSVIEW",json.dumps(contexts(rr.text,"contentsView(",1500,20),ensure_ascii=False))
          ss=BeautifulSoup(rr.text,"html.parser")
          rows=[]
          for tr in ss.find_all("tr"):
            tx=clean(tr.get_text(" ",strip=True))
            html=str(tr)
            if "contentsView(" in html or any(k in tx for k in ("채용","모집")):
              rows.append({"text":tx[:700],"html":html[:2500]})
          print("DBFAC_ROWS",json.dumps(rows[:30],ensure_ascii=False))
          PY
