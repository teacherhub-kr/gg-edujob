name: Foundation targeted read-only diagnostics

on:
  pull_request:
    paths:
      - '.github/workflows/foundation-targeted-diagnostics.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install diagnostics dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Verify only Seocho board and Jungnang public API
        run: |
          python - <<'PY'
          import json,requests
          from bs4 import BeautifulSoup
          H={"User-Agent":"Mozilla/5.0"}
          s=requests.Session()

          seo="https://www.seochocf.or.kr/site/main/archive/post/category/%EA%B3%B5%EC%A7%80%EC%82%AC%ED%95%AD?metaCode1=RECRUIT"
          r=s.get(seo,headers=H,timeout=25,allow_redirects=True)
          r.encoding=r.apparent_encoding or r.encoding
          soup=BeautifulSoup(r.text,"html.parser")
          print("SEOCHO",r.status_code,r.url,len(r.content),soup.title.get_text(" ",strip=True) if soup.title else "")
          rows=[]
          for a in soup.find_all("a",href=True):
              text=" ".join(a.get_text(" ",strip=True).split())
              if "채용" in text or "모집" in text:
                  rows.append({"text":text[:300],"href":str(a.get("href"))[:700]})
          print("SEOCHO_ROWS",json.dumps(rows[:40],ensure_ascii=False))

          api="https://api.ninehire.com/identity-access/homepage/recruitments"
          params={
              "companyId":"81a087a0-8219-11f0-a147-4f7234c30f38",
              "page":1,
              "countPerPage":20,
          }
          x=s.get(api,params=params,headers=H,timeout=25)
          print("NINE",x.status_code,x.url,len(x.content),x.headers.get("content-type"))
          try:
              data=x.json()
              print("NINE_JSON",json.dumps(data,ensure_ascii=False)[:30000])
          except Exception:
              print("NINE_TEXT",x.text[:10000])
          PY
