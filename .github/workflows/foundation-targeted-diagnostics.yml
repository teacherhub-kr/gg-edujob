name: Foundation targeted read-only diagnostics

on:
  pull_request:
    paths:
      - '.github/workflows/foundation-targeted-diagnostics.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Verify Seocho ApplyIn jobs endpoint
        run: |
          python - <<'PY'
          import json,requests
          H={"User-Agent":"Mozilla/5.0","Accept":"application/json"}
          s=requests.Session()
          root=s.get("https://seochocf.applyin.co.kr/",headers=H,timeout=25)
          print("ROOT",root.status_code,root.url,len(root.content))
          for params in ({},{"page":1,"itemsPerPage":100},{"page":1,"perPage":100}):
              r=s.get("https://seochocf.applyin.co.kr/jobs",headers=H,params=params,timeout=25)
              print("JOBS",r.status_code,r.url,len(r.content),r.headers.get("content-type"))
              try: print("JSON",json.dumps(r.json(),ensure_ascii=False)[:30000])
              except Exception: print("TEXT",r.text[:10000])
          PY
