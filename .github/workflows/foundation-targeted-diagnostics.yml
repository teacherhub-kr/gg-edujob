name: Foundation targeted read-only diagnostics

on:
  pull_request:
    paths:
      - '.github/workflows/foundation-targeted-diagnostics.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install diagnostics dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Probe exact remaining contracts
        run: |
          python - <<'PY'
          import json,re,requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          H={"User-Agent":"Mozilla/5.0"}
          def clean(x): return " ".join(str(x or "").split())
          def around(raw,needle,r=1800):
            i=raw.find(needle)
            return clean(raw[max(0,i-r):i+r]) if i>=0 else ""

          for base in ["https://www.gdfac.or.kr/community/ko/notice","https://www.caci.or.kr/community/ko/notice"]:
            rr=requests.get(base,headers=H,timeout=25); rr.encoding=rr.apparent_encoding or rr.encoding
            soup=BeautifulSoup(rr.text,"html.parser")
            print("\n===== VUE",base)
            for src in [s.get("src") for s in soup.find_all("script") if s.get("src")]:
              try:
                js=requests.get(urljoin(base,src),headers=H,timeout=20).text
              except Exception:
                continue
              if "createHistoryBackKey" in js:
                print("HISTORY_JS",src,around(js,"createHistoryBackKey",3500))
            print("INLINE_GETSEARCH",around(rr.text,"getSearchResults",4500))

          # ApplyIn candidate public routes and bundle request literals.
          base="https://seochocf.applyin.co.kr/"
          rr=requests.get(base,headers=H,timeout=25); rr.encoding=rr.apparent_encoding or rr.encoding
          soup=BeautifulSoup(rr.text,"html.parser")
          for path in ["/recruiting/recruiting-list","/api/recruits","/api/recruiting","/api/recruitments","/recruits"]:
            try:
              x=requests.get(urljoin(base,path),headers=H,timeout=20)
              x.encoding=x.apparent_encoding or x.encoding
              print("APPLY_ROUTE",path,x.status_code,x.url,len(x.content),clean(x.text)[:1200])
            except Exception as e: print("APPLY_ROUTE_ERR",path,type(e).__name__,str(e))
          for src in [s.get("src") for s in soup.find_all("script") if s.get("src")]:
            js=requests.get(urljoin(base,src),headers=H,timeout=25).text
            lits=sorted(set(re.findall(r'["\']([^"\']*(?:recruit|job)[^"\']*)["\']',js,re.I)))
            api=[x for x in lits if "/" in x and len(x)<220]
            print("APPLY_LITERALS",src,json.dumps(api[:250],ensure_ascii=False))

          # Dobong exact current detail contract.
          for cid in ["caf299857022408fbcbfff2375dc5e5f","84288269650f42f8bf38f69c2011a27b"]:
            url="https://www.dbfac.or.kr/front/board/boardContentsView.do?board_id=7&contents_id="+cid
            x=requests.get(url,headers=H,timeout=25); x.encoding=x.apparent_encoding or x.encoding
            print("DBFAC_DETAIL",cid,x.status_code,x.url,len(x.content),clean(BeautifulSoup(x.text,"html.parser").get_text(" ",strip=True))[:3500])

          # Jungnang Next chunks: strings around job-posting/API concepts.
          base="https://recruit.jnfac.or.kr/recruit"
          rr=requests.get(base,headers=H,timeout=25); rr.encoding=rr.apparent_encoding or rr.encoding
          soup=BeautifulSoup(rr.text,"html.parser")
          for src in [s.get("src") for s in soup.find_all("script") if s.get("src")]:
            if not src.startswith("/_next/"): continue
            js=requests.get(urljoin(base,src),headers=H,timeout=20).text
            if any(k in js for k in ("job_posting","recruitment","jobPosting","recruit")):
              hints=sorted(set(re.findall(r'["\']([^"\']{0,120}(?:api|recruit|job)[^"\']{0,120})["\']',js,re.I)))
              if hints: print("JNFAC_CHUNK",src,json.dumps(hints[:160],ensure_ascii=False))
          PY
