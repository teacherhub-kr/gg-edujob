name: Verified Seoul-Gyeonggi official refresh (Incheon isolated)
on:
  workflow_dispatch:
  # Direct 3-hour official refresh. The scheduled job only dispatches when
  # the verified regional policy says collection is due and safe.
  schedule:
    - cron: '17 */3 * * *'
  pull_request:
    paths:
      - '.github/workflows/seoul-gyeonggi-official.yml'
      - 'scripts/publish_seoul_gyeonggi_snapshot.py'
      - 'scripts/build_unified_search_multi.py'
      - 'scripts/validate_required_metro_publication.py'
      - 'tests/test_seoul_gyeonggi_snapshot.py'
      - 'tests/test_guri_support_board_contract.py'
      - 'tests/test_mircms_pagination_proof.py'
      - 'scripts/complete_support_coverage.py'
      - 'scripts/probe_guri_support.py'
      - 'sources.json'
      - 'board_cache.json'
permissions:
  contents: write
  actions: write
concurrency:
  group: metro-edujob-data
  cancel-in-progress: false
jobs:
  scheduled_official_dispatch:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Sync latest official scheduler policy
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Confirm verified snapshot, cooldown, and active writers
        id: official_gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/seoul-gyeonggi-official.yml/runs?per_page=100" > /tmp/sg-scheduled-runs.json
          gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/unified-search.yml/runs?per_page=100" > /tmp/sg-scheduled-unified.json
          PYTHONPATH=scripts python scripts/seoul_gyeonggi_watchdog.py \
            --selected-action fast \
            --runs /tmp/sg-scheduled-runs.json \
            --unified-runs /tmp/sg-scheduled-unified.json \
            --github-output "$GITHUB_OUTPUT"
      - name: Dispatch only independently due Seoul/Gyeonggi collection
        if: github.event_name == 'schedule' && steps.official_gate.outputs.action == 'seoul-gyeonggi'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Re-check active production dispatches immediately before queuing.
          active="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/seoul-gyeonggi-official.yml/runs?per_page=100" \
            --jq '[.workflow_runs[] | select(.event == "workflow_dispatch" and .head_branch == "main" and (.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "requested" or .status == "pending"))] | length')"
          if [ "${active:-0}" -gt 0 ]; then
            echo "Existing official writer is active; skip duplicate dispatch."
            exit 0
          fi
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/actions/workflows/seoul-gyeonggi-official.yml/dispatches" -f ref=main
          echo "Dispatched verified Seoul/Gyeonggi official refresh; Incheon remains held."

  guri_official_live_proof:
    # Pull requests are read-only; only the approved official hiring boards
    # are scanned. This is required evidence before production merge.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Read-only live 90-day proof of five canonical Guri recruitment boards
        timeout-minutes: 20
        run: python scripts/probe_guri_support.py

  mircms_last_page_live_proof:
    # Read-only proof of the two official boards that previously hit a
    # repeated final page despite advertising a finite page count.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Independently prove Suwon and Siheung notice-board 90-day coverage
        timeout-minutes: 30
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import json
          from urllib.parse import parse_qs, urlparse
          from complete_support_coverage import SOURCES, gyeonggi_board
          targets = {
              "수원교육지원청": "11021",
              "시흥교육지원청": "5511",
          }
          for name, bbs in targets.items():
              src = next(x for x in SOURCES["gyeonggi"]["supportOffices"] if x["name"] == name)
              boards = [
                  url for url in src["boardUrls"]
                  if (parse_qs(urlparse(url).query).get("bbsId") or [""])[0] == bbs
              ]
              assert len(boards) == 1, (name, "missing official board")
              rows, meta = gyeonggi_board(boards[0], src)
              print(json.dumps({
                  "office": name, "rows": len(rows), "boardHealth": meta
              }, ensure_ascii=False), flush=True)
              assert meta["coverageComplete"] is True, (name, meta)
              assert meta["accessError"] is False and meta["paginationRepeated"] is False
              assert meta["paginationCounterMismatch"] is False
              assert meta["crossedLookback"] or meta["naturalEnd"]
          PY

  regional:
    # A schedule event is a read-only dispatcher; production collector still
    # runs only on a fresh workflow_dispatch, preserving existing isolation.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Synchronize production branch
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install verified collector dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Static and regression contracts (no Incheon network calls)
        run: |
          python -m py_compile scripts/publish_seoul_gyeonggi_snapshot.py scripts/build_unified_search_multi.py scripts/validate_required_metro_publication.py
          PYTHONPATH=scripts python -m unittest tests.test_seoul_gyeonggi_snapshot tests.test_guri_support_board_contract tests.test_mircms_pagination_proof tests.test_official_direct_schedule
      - name: Capture immutable official baseline
        if: github.event_name != 'pull_request'
        run: |
          python scripts/publication_transaction.py capture --output /tmp/sg-official-base-sha
          cp jobs.json /tmp/sg-official-previous.json
      - name: Scrape Seoul/Gyeonggi only
        if: github.event_name != 'pull_request'
        timeout-minutes: 60
        run: |
          python scripts/scrape_jobs.py
          python scripts/repair_gyeonggi_support.py --lookback-days 21
      - name: Prove full support-office traversal (25 Gyeonggi, 11 Seoul)
        if: github.event_name != 'pull_request'
        timeout-minutes: 65
        run: python scripts/complete_support_coverage.py
      - name: Recover 90-day Gyeonggi central official population
        if: github.event_name != 'pull_request'
        timeout-minutes: 40
        run: python scripts/publish_seoul_gyeonggi_snapshot.py --merge-central
      - name: Enrich verified Seoul/Gyeonggi details
        if: github.event_name != 'pull_request'
        timeout-minutes: 40
        run: |
          python scripts/resolve_support_links.py
          python scripts/enrich_support_periods.py
          python scripts/enrich_seoul_get_fallback.py
          python scripts/recover_seoul_office_cms_jobs.py
          python scripts/sanitize_job_dates.py
      - name: Independent 90-day/central and links proof
        if: github.event_name != 'pull_request'
        timeout-minutes: 45
        run: |
          python scripts/verify_central_pagination.py
          python scripts/verify_gyeonggi_central_90d.py
          python scripts/verify_jobs.py
      - name: Construct verified regional snapshot without touching jobs.json
        if: github.event_name != 'pull_request'
        run: |
          python scripts/publish_seoul_gyeonggi_snapshot.py --finalize
          git restore -- jobs.json
          git diff --exit-code -- jobs.json
      - name: Publish only independently verified regional files
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add seoul_gyeonggi_jobs.json seoul_gyeonggi_refresh_report.json
          python scripts/publication_transaction.py publish \
            --baseline-file /tmp/sg-official-base-sha \
            --status-file /tmp/sg-official-transaction.json \
            --message 'Publish verified Seoul/Gyeonggi official snapshot (Incheon held)'
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('/tmp/sg-official-transaction.json').read_text())
          state=result.get('state')
          if state not in ('published', 'no-change'):
              raise SystemExit(f'Regional snapshot publication did not finish: {state}')
          print('Verified regional snapshot transaction:', state)
          PY
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/actions/workflows/unified-search.yml/dispatches" -f ref=main
      - name: Record publication diagnostics
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: seoul-gyeonggi-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/sg-official-transaction.json
            seoul_gyeonggi_refresh_report.json
          if-no-files-found: warn
          retention-days: 14
