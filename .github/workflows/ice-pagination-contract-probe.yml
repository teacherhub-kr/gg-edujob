name: ICE official central page contract probe

on:
  pull_request:
    paths:
      - 'scripts/merge_incheon_official.py'
      - 'scripts/probe_incheon_pagination_contract.py'
      - 'scripts/probe_incheon_browser_pagination.cjs'
      - 'scripts/probe_ice_all_board_index.py'
      - 'tests/test_probe_ice_all_board_index.py'
      - 'tests/test_incheon_paging_form.py'
      - 'tests/test_incheon_pagination_probe_workflow.py'
      - '.github/workflows/ice-pagination-contract-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Verify production paging-form regression tests
        env:
          PYTHONPATH: .:scripts
        run: python tests/test_incheon_paging_form.py
      - name: Verify probe regression contracts
        run: |
          python tests/test_incheon_pagination_probe_workflow.py
          python -m unittest tests.test_probe_ice_all_board_index
      - name: Install browser-only diagnostic dependencies
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Probe production ICE collector contract
        id: production_probe
        continue-on-error: true
        env:
          PYTHONPATH: scripts
        run: python scripts/merge_incheon_official.py --check-only --lookback-days 14 --max-pages 60 --transient-retries 1 --retry-delay-seconds 5
      - name: Check actual official goPaging(2) behavior in Chromium
        id: browser_probe
        continue-on-error: true
        run: node scripts/probe_incheon_browser_pagination.cjs
      - name: Probe only official ICE page 2 request variants (read-only)
        id: requests_probe
        continue-on-error: true
        env:
          PYTHONPATH: scripts
        run: python scripts/probe_incheon_pagination_contract.py
      - name: Probe official ICE all-board index fallback (read-only diagnostic)
        id: all_board_probe
        continue-on-error: true
        run: python scripts/probe_ice_all_board_index.py
      - name: Require at least one independently distinct page-2 proof
        if: always()
        env:
          PRODUCTION_OUTCOME: ${{ steps.production_probe.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser_probe.outcome }}
          REQUESTS_OUTCOME: ${{ steps.requests_probe.outcome }}
        run: |
          echo "production_probe=${PRODUCTION_OUTCOME} browser_probe=${BROWSER_OUTCOME} requests_probe=${REQUESTS_OUTCOME} all_board_diagnostic=${ALL_BOARD_OUTCOME}"
          if [[ "${PRODUCTION_OUTCOME}" != "success" ]]; then
            echo "The production ICE collector did not prove complete traversal."
            exit 1
          fi
          if [[ "${BROWSER_OUTCOME}" != "success" && "${REQUESTS_OUTCOME}" != "success" ]]; then
            echo "Neither a real browser nor the bounded official-request probe proved a distinct page 2."
            exit 1
          fi
