name: Reconciliation population preflight

on:
  pull_request:
    paths:
      - 'scripts/ensure_incheon_registry.py'
      - 'scripts/merge_incheon_official.py'
      - 'scripts/source_registry.py'
      - 'scripts/verify_required_regions.py'
      - 'scripts/verify_central_pagination.py'
      - 'scripts/scrape_jobs.py'
      - 'scripts/reconcile_source_ids.py'
      - 'scripts/verify_central_reconciliation_consistency.py'
      - '.github/workflows/reconciliation-population-preflight.yml'

permissions:
  contents: read

concurrency:
  group: reconciliation-population-preflight-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  live-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile reconciliation population proof
        run: |
          python -m py_compile scripts/ensure_incheon_registry.py scripts/merge_incheon_official.py scripts/collect_incheon_support.py scripts/verify_required_regions.py scripts/verify_central_pagination.py scripts/reconcile_source_ids.py scripts/verify_central_reconciliation_consistency.py scripts/scrape_jobs.py
      - name: Materialize the reviewed three-region registry in this read-only checkout
        env:
          PYTHONPATH: scripts
        run: |
          python scripts/ensure_incheon_registry.py
          python - <<'PY'
          import json
          from pathlib import Path
          from source_registry import official_source_count
          registry=json.loads(Path('sources.json').read_text(encoding='utf-8'))
          assert {'gyeonggi','seoul','incheon'} <= set(registry), registry.keys()
          assert official_source_count() == 44, official_source_count()
          boards=((registry.get('incheon') or {}).get('central') or {}).get('requiredBoards') or []
          assert {str(x.get('bbsId')) for x in boards} == {'1981','1534'}, boards
          print('preflight registry materialized: 44 logical sources, two mandatory Incheon boards')
          PY
      - name: Apply production pagination hardeners in isolated PR checkout
        run: |
          python scripts/harden_central_pagination.py
          python scripts/harden_reconciliation_central_lookback.py
      - name: Prove structural pagination before reconciliation
        run: python scripts/verify_central_pagination.py
      - name: Refresh independent Gyeonggi 90-day evidence
        run: python scripts/verify_gyeonggi_central_90d.py
      - name: Reconcile current official source IDs without publishing
        shell: bash
        run: |
          set +e
          python scripts/reconcile_source_ids.py
          rc=$?
          if [ -f source_reconciliation_report.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('source_reconciliation_report.json').read_text(encoding='utf-8'))
          print('reconciliation summary=', json.dumps(report.get('summary', {}), ensure_ascii=False))
          print('incomplete sources=', json.dumps(report.get('incompleteSources', []), ensure_ascii=False))
          for source in report.get('sources', []):
              if not source.get('reconciled'):
                  print('incomplete source detail=', json.dumps(source, ensure_ascii=False))
          PY
          fi
          exit "$rc"
      - name: Re-prove the same live population and require agreement
        run: |
          python scripts/verify_central_pagination.py
          python scripts/verify_central_reconciliation_consistency.py
      - name: Assert structural IDs are never hidden by recruitment filtering
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('central_pagination_report.json').read_text(encoding='utf-8'))
          assert report.get('complete') is True, report
          for source in report.get('sources', []):
              parsed=int(source.get('parsedStableIdCount') or 0)
              recruitment=int(source.get('stableIdCount') or 0)
              excluded=int(source.get('excludedNonRecruitmentCount') or 0)
              assert parsed >= recruitment > 0, source
              assert parsed - recruitment == excluded, source
          print('population-aligned central proof', [(s.get('name'), s.get('parsedStableIdCount'), s.get('stableIdCount'), s.get('excludedNonRecruitmentCount')) for s in report.get('sources', [])])
          PY
