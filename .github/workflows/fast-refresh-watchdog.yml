name: Production operations watchdog

on:
  workflow_dispatch:
  schedule:
    # One scheduled supervisor, but register each offset as an independent cron.
    # This keeps the same 15-minute cadence while reducing dependence on a single
    # schedule registration when GitHub delays or drops individual scheduled events.
    - cron: '4 * * * *'
    - cron: '19 * * * *'
    - cron: '34 * * * *'
    - cron: '49 * * * *'

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: production-operations-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Synchronize latest canonical control plane
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - name: Decide one safe action and manage incidents
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/production_supervisor.py \
            --github-output "$GITHUB_OUTPUT" \
            --state-file /tmp/production-supervisor.json \
            --manage-issues
      - name: Dispatch the selected production action
        if: steps.gate.outputs.action == 'fast' || steps.gate.outputs.action == 'recovery' || steps.gate.outputs.action == 'completeness' || steps.gate.outputs.action == 'unified' || startsWith(steps.gate.outputs.action, 'private-')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ steps.gate.outputs.action }}
        run: |
          set -euo pipefail
          case "$ACTION" in
            fast) workflow='update-jobs.yml' ;;
            recovery) workflow='recover-missing-jobs.yml' ;;
            completeness) workflow='official-completeness-audit.yml' ;;
            unified) workflow='unified-search.yml' ;;
            private-lessoninfo) workflow='update-lessoninfo-jobs.yml' ;;
            private-jobteacher) workflow='update-jobteacher-jobs.yml' ;;
            private-artmore-candidate) workflow='update-artmore-candidate.yml' ;;
            private-artmore-promote) workflow='promote-artmore.yml' ;;
            private-gonggonggangsa) workflow='update-gonggonggangsa-jobs.yml' ;;
            private-seekle) workflow='update-seekle-instructor-jobs.yml' ;;
            private-boramyc) workflow='update-boramyc-instructor-jobs.yml' ;;
            private-foundation) workflow='cultural-foundation-coverage.yml' ;;
            *) echo "Unknown action: $ACTION" >&2; exit 2 ;;
          esac
          # Re-check the selected writer immediately before dispatch. The supervisor
          # decision may be stale by the time this step runs, and API-read failures
          # must fail closed rather than creating a duplicate queued writer.
          active="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?per_page=30" \
            --jq '[.workflow_runs[] | select(.event == "workflow_dispatch" and .head_branch == "main" and (.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "requested" or .status == "pending"))] | length')"
          if [ "${active:-0}" -gt 0 ]; then
            echo "Production workflow already active; no duplicate dispatch: ${workflow}."
            exit 0
          fi
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/dispatches" \
            -f ref=main
          echo "Dispatched ${workflow} for action=${ACTION}."
      - name: Measure official visibility latency
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/measure_visibility_latency.py \
            --repo "${GITHUB_REPOSITORY}" \
            --window-hours 48 \
            --slo-hours 4 \
            --output /tmp/visibility_latency_report.json

      - name: Show supervisor decision
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/production-supervisor.json ]; then
            cat /tmp/production-supervisor.json
          fi
