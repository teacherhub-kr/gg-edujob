name: Production operations watchdog

on:
  workflow_dispatch:
  schedule:
    # Single scheduler. All production writer workflows remain dispatch-only.
    - cron: '17,47 * * * *'

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: production-operations-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Synchronize latest canonical control plane
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - name: Decide one safe action and manage incidents
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/production_supervisor.py \
            --github-output "$GITHUB_OUTPUT" \
            --state-file /tmp/production-supervisor.json \
            --manage-issues
      - name: Dispatch the selected production action
        if: steps.gate.outputs.action == 'fast' || steps.gate.outputs.action == 'recovery' || steps.gate.outputs.action == 'completeness' || steps.gate.outputs.action == 'unified' || startsWith(steps.gate.outputs.action, 'private-')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ steps.gate.outputs.action }}
        run: |
          set -euo pipefail
          case "$ACTION" in
            fast) workflow='update-jobs.yml' ;;
            recovery) workflow='recover-missing-jobs.yml' ;;
            completeness) workflow='official-completeness-audit.yml' ;;
            unified) workflow='unified-search.yml' ;;
            private-lessoninfo) workflow='update-lessoninfo-jobs.yml' ;;
            private-jobteacher) workflow='update-jobteacher-jobs.yml' ;;
            private-artmore-candidate) workflow='update-artmore-candidate.yml' ;;
            private-artmore-promote) workflow='promote-artmore.yml' ;;
            private-gonggonggangsa) workflow='update-gonggonggangsa-jobs.yml' ;;
            private-seekle) workflow='update-seekle-instructor-jobs.yml' ;;
            private-boramyc) workflow='update-boramyc-instructor-jobs.yml' ;;
            private-foundation) workflow='cultural-foundation-coverage.yml' ;;
            *) echo "Unknown action: $ACTION" >&2; exit 2 ;;
          esac
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/dispatches" \
            -f ref=main
          echo "Dispatched ${workflow} for action=${ACTION}."
      - name: Show supervisor decision
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/production-supervisor.json ]; then
            cat /tmp/production-supervisor.json
          fi
