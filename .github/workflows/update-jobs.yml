name: Update 수도권 education jobs

on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write

concurrency:
  group: metro-edujob-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Synchronize latest main after any queue delay
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - name: Report workflow definition drift after sync
        shell: bash
        run: |
          set -euo pipefail
          RUNNING="$(git show "${GITHUB_SHA}:.github/workflows/update-jobs.yml" | sha256sum | cut -d' ' -f1)"
          LATEST="$(git show "origin/main:.github/workflows/update-jobs.yml" | sha256sum | cut -d' ' -f1)"
          echo "workflow definition SHA in use: ${GITHUB_SHA}"
          if [ "$RUNNING" != "$LATEST" ]; then
            echo "::warning title=Stale workflow definition::This run executes update-jobs.yml from ${GITHUB_SHA}, which differs from origin/main. Re-dispatch after the current run to exercise the newest orchestration."
          else
            echo "workflow definition matches origin/main"
          fi
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install collector dependencies
        run: pip install -r requirements.txt
      - name: Mark fast refresh start
        run: python scripts/update_collector_status.py --workflow fast --stage baseline --state running

      - name: Preserve newest valid published baseline
        shell: bash
        run: |
          set -euo pipefail
          is_valid_jobs() {
            python - "$1" <<'PY'
          import json, sys
          from pathlib import Path
          try:
              d=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
              jobs=d.get('jobs',[]) if isinstance(d,dict) else []
              ok=len(jobs)>=100
          except Exception:
              ok=False
          raise SystemExit(0 if ok else 1)
          PY
          }
          if is_valid_jobs jobs.json; then
            cp jobs.json /tmp/jobs_previous.json
          else
            found=''
            while read -r commit; do
              if git show "${commit}:jobs.json" >/tmp/jobs_candidate.json 2>/dev/null && is_valid_jobs /tmp/jobs_candidate.json; then
                cp /tmp/jobs_candidate.json /tmp/jobs_previous.json
                found="$commit"; break
              fi
            done < <(git rev-list HEAD -- jobs.json)
            [ -n "$found" ] || { echo 'No valid historical jobs baseline' >&2; exit 1; }
            cp /tmp/jobs_previous.json jobs.json
          fi

      - name: Verify fast collectors and materialize Incheon registry migration
        shell: bash
        run: |
          set -euo pipefail
          python scripts/update_collector_status.py --workflow fast --stage hardening --state running
          # The one-time registry migration is configuration materialization, not source patching.
          # Collector behavior is validated by compilation and downstream fail-closed verification,
          # not by brittle source-text grep contracts that drift during refactors.
          python scripts/ensure_incheon_registry.py
          python -m py_compile scripts/scrape_jobs.py scripts/merge_incheon_official.py scripts/collect_incheon_support.py scripts/verify_required_regions.py scripts/ensure_incheon_registry.py scripts/repair_gyeonggi_support.py scripts/resolve_support_links.py scripts/enrich_support_periods.py scripts/enrich_seoul_get_fallback.py scripts/recover_seoul_office_cms_jobs.py scripts/verify_jobs.py scripts/merge_recovery_snapshot.py scripts/update_collection_state.py scripts/update_collector_status.py scripts/sanitize_job_dates.py scripts/validate_reconciliation_policy.py scripts/validate_reconciliation_policy_v3.py scripts/sync_effective_audit_status.py scripts/reconcile_source_ids.py scripts/verify_central_reconciliation_consistency.py scripts/stable_source_identity.py scripts/verify_support_completeness.py
          git diff --exit-code -- scripts

      - name: Fast crawl of central portals and support-office current pages
        timeout-minutes: 55
        run: |
          python scripts/update_collector_status.py --workflow fast --stage fast-crawl --state running
          python scripts/scrape_jobs.py
          python scripts/merge_incheon_official.py --lookback-days 90 --transient-retries 2 --retry-delay-seconds 15
          python scripts/collect_incheon_support.py --lookback-days 90
          python scripts/verify_required_regions.py

      - name: Fast re-check of Gyeonggi support-office boards
        timeout-minutes: 25
        run: |
          python scripts/update_collector_status.py --workflow fast --stage gyeonggi-recheck --state running
          python scripts/repair_gyeonggi_support.py --lookback-days 21

      - name: Sanitize impossible registration dates
        run: python scripts/sanitize_job_dates.py

      - name: Preserve active postings missing only from this fast crawl
        run: |
          python scripts/update_collector_status.py --workflow fast --stage baseline-merge --state running
          python scripts/merge_recovery_snapshot.py --previous /tmp/jobs_previous.json --report missing_recovery_report.json

      - name: Resolve exact detail links and enrich application/hiring periods
        run: |
          python scripts/update_collector_status.py --workflow fast --stage detail-enrichment --state running
          python scripts/resolve_support_links.py
          python scripts/enrich_support_periods.py
          python scripts/enrich_seoul_get_fallback.py

      - name: Recover verified Seoul support-office CMS recruitment posts
        run: |
          python scripts/update_collector_status.py --workflow fast --stage seoul-cms-recovery --state running
          python scripts/recover_seoul_office_cms_jobs.py
          python scripts/sanitize_job_dates.py

      - name: Independent fast-publication verification
        timeout-minutes: 25
        shell: bash
        run: |
          set -euo pipefail
          python scripts/update_collector_status.py --workflow fast --stage verification --state running
          rm -f verification_failure_report.json
          if ! python scripts/verify_jobs.py --previous /tmp/jobs_previous.json; then
            python - <<'PY'
          import json
          from pathlib import Path
          try:
              data=json.loads(Path('jobs.json').read_text(encoding='utf-8'))
              report=data.get('verification',{}) if isinstance(data,dict) else {}
          except Exception as e:
              report={'state':'critical','message':f'failed to read verification payload: {type(e).__name__}'}
          Path('verification_failure_report.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          print(json.dumps(report, ensure_ascii=False))
          PY
            cp /tmp/jobs_previous.json jobs.json
            echo 'Fast refresh validation failed; kept previous publication and preserved diagnostics.' >&2
            exit 1
          fi

      - name: Persist append-only recruitment ledger and checkpoints
        run: |
          python scripts/update_collector_status.py --workflow fast --stage ledger --state running
          python scripts/update_collection_state.py

      - name: Refresh official reconciliation evidence for current fast dataset
        timeout-minutes: 60
        shell: bash
        run: |
          set -euo pipefail
          python scripts/update_collector_status.py --workflow fast --stage official-reconciliation --state running
          echo "RECONCILE_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          SCAN_ID="$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export RECONCILE_SCAN_ID="${SCAN_ID}"
          echo "RECONCILE_SCAN_ID=${RECONCILE_SCAN_ID}" >> "$GITHUB_ENV"
          echo "Fast publication reconciliation scan: ${RECONCILE_SCAN_ID}"
          python scripts/verify_central_pagination.py
          python scripts/stamp_reconciliation_scan.py --central
          python scripts/verify_gyeonggi_central_90d.py
          python scripts/reconcile_source_ids.py
          python scripts/stamp_reconciliation_scan.py --reconciliation
          rm -f official_id_restore_report.json
          python scripts/validate_reconciliation_policy_v3.py
          python scripts/verify_central_pagination.py
          python scripts/stamp_reconciliation_scan.py --central
          python scripts/verify_central_reconciliation_consistency.py

      - name: Verify current support traversal and exact links after reconciliation
        run: |
          python scripts/resolve_support_links.py
          python scripts/verify_support_completeness.py

      - name: Pre-publication official-ID delta reconciliation
        timeout-minutes: 60
        shell: bash
        run: |
          set -euo pipefail
          # Re-read every registered official source immediately before publication.
          # The earlier reconciliation can become stale while detail/support verification runs.
          # Recover any newly appeared stable IDs, then re-run the affected publication guards.
          python scripts/update_collector_status.py --workflow fast --stage prepublish-delta --state running
          python scripts/reconcile_source_ids.py
          python scripts/stamp_reconciliation_scan.py --reconciliation
          python scripts/resolve_support_links.py
          python scripts/verify_support_completeness.py
          python scripts/validate_reconciliation_policy_v3.py
          python scripts/verify_required_regions.py

      - name: Final publication guard
        run: |
          python scripts/update_collector_status.py --workflow fast --stage publication-guard --state running
          python scripts/validate_reconciliation_policy_v3.py
          python scripts/verify_required_regions.py
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('jobs.json').read_text(encoding='utf-8'))
          jobs=d.get('jobs',[]) if isinstance(d,dict) else []
          if len(jobs)<100: raise SystemExit(f'Refusing publication: only {len(jobs)} jobs')
          print(f'Fast publication guard passed: {len(jobs)} jobs')
          PY
          python scripts/update_collector_status.py --workflow fast --stage complete --state success
          python scripts/sync_effective_audit_status.py

      - name: Commit only verified fast refresh state
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f verification_failure_report.json
          # Fast publication may materialize the one-time Incheon registry entry, but it must not
          # commit collector source code. Source changes belong in reviewed PRs only.
          git add collector_status.json deep_audit_status.json jobs.json job_ledger.json collection_state.json board_cache.json missing_recovery_report.json seoul_office_cms_recovery_report.json date_anomaly_report.json support_link_resolution.json support_period_cache.json sources.json incheon_official_report.json incheon_support_report.json
          git add support_coverage_report.json source_reconciliation_report.json source_id_ledger.json central_pagination_report.json gyeonggi_central_90d_report.json
          if git ls-files --error-unmatch verification_failure_report.json >/dev/null 2>&1; then
            git add -u -- verification_failure_report.json
          fi
          git diff --cached --quiet && exit 0
          git commit -m 'Fast refresh verified recruitment postings'
          git reset --hard HEAD
          git pull --rebase
          git push


      - name: Dispatch unified publication when canonical jobs advanced
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main
          jobs_ts="$(git log -1 --format=%ct origin/main -- jobs.json || true)"
          unified_ts="$(git log -1 --format=%ct origin/main -- unified_jobs.json || true)"
          if [ -z "$jobs_ts" ]; then
            echo "No canonical jobs.json commit found; refusing follow-up dispatch."
            exit 1
          fi
          if [ -n "$unified_ts" ] && [ "$jobs_ts" -le "$unified_ts" ]; then
            echo "Unified publication is already current."
            exit 0
          fi
          active="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/unified-search.yml/runs?per_page=10" \
            --jq '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress")] | length')"
          if [ "${active:-0}" -gt 0 ]; then
            echo "Unified publication already queued/in progress; skipping duplicate dispatch."
            exit 0
          fi
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/unified-search.yml/dispatches" \
            -f ref=main
          echo "Dispatched unified publication immediately after verified data publication."

      - name: Preserve last-known-good on fast refresh failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          # GitHub Actions run history is the authoritative failure state. Do not create
          # status-only commits: they churn main and can themselves retrigger stale decisions.
          if [ -f verification_failure_report.json ]; then
            echo 'Fast verification diagnostics were generated in this failed run; publication remains unchanged.'
          fi
          git reset --hard HEAD
          echo 'Fast refresh failed; preserved last-known-good publication without mutating main.'
