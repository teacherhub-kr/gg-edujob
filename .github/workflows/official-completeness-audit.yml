name: Official completeness deep audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: official-completeness-deep-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install collector dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Verify snapshot-bound completeness classification
        run: python -m unittest tests.test_verify_published_scan_completeness
      - name: Preserve the published scan evidence for omission accounting
        run: |
          cp jobs.json /tmp/production_jobs.json
          cp source_id_ledger.json /tmp/production_source_id_ledger.json
          cp source_reconciliation_report.json /tmp/production_source_reconciliation_report.json
      - name: Require all mandatory regional registries and runtime regions
        run: python scripts/verify_required_regions.py
      - name: Independently prove central pagination and Gyeonggi 90-day traversal
        run: |
          python scripts/verify_central_pagination.py
          python scripts/verify_gyeonggi_central_90d.py
      - name: Independently prove complete Incheon official network
        run: |
          python scripts/merge_incheon_official.py --check-only --lookback-days 90 --transient-retries 2 --retry-delay-seconds 15
          python scripts/collect_incheon_support.py --check-only --lookback-days 90
      - name: Reconcile the current official registry without publishing
        run: python scripts/reconcile_source_ids.py
      - name: Verify published-scan completeness and report live freshness delta
        run: |
          python scripts/verify_published_scan_completeness.py \
            --published-jobs /tmp/production_jobs.json \
            --published-ledger /tmp/production_source_id_ledger.json \
            --published-report /tmp/production_source_reconciliation_report.json \
            --live-ledger source_id_ledger.json \
            --live-report source_reconciliation_report.json
      - name: Require independent central/reconciliation agreement
        run: python scripts/verify_central_reconciliation_consistency.py
      - name: Require complete Incheon central and five-office proof
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('incheon_official_report.json').read_text(encoding='utf-8'))
          health=r.get('boardHealth') or []
          complete={str(x.get('bbsId')) for x in health if x.get('coverageComplete') is True}
          if r.get('coverageComplete') is not True or complete != {'1981','1534'}:
              raise SystemExit(f'Incheon mandatory-board proof incomplete: {r}')
          print('Incheon two-board completeness proof passed')
          support=json.loads(Path('incheon_support_report.json').read_text(encoding='utf-8'))
          if support.get('officeCount') != 5 or support.get('completeOffices') != 5:
              raise SystemExit(f'Incheon support-office proof incomplete: {support}')
          print('Incheon five-office completeness proof passed')
          PY
      - name: Upload independent completeness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-completeness-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            source_reconciliation_report.json
            central_pagination_report.json
            gyeonggi_central_90d_report.json
            incheon_official_report.json
            incheon_support_report.json
            published_scan_completeness_report.json
          if-no-files-found: warn
          retention-days: 14
