name: ArtMore PR live proof

on:
  pull_request:
    paths:
      - 'scripts/crawl_artmore_browser.py'
      - 'scripts/crawl_artmore_browser_v2.py'
      - '.github/workflows/artmore-pr-live-proof.yml'

permissions:
  contents: read

concurrency:
  group: artmore-pr-live-proof-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  live-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install browser dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Syntax check
        run: python -m py_compile scripts/crawl_artmore_browser.py scripts/crawl_artmore_browser_v2.py
      - name: Collect isolated ArtMore candidate read-only
        env:
          ARTMORE_MAX_PAGES: '250'
        run: python scripts/crawl_artmore_browser_v2.py
      - name: Validate candidate safety gate
        run: |
          python - <<'PY'
          import json, pathlib
          r=json.loads(pathlib.Path('artmore_reconciliation_report.candidate.json').read_text(encoding='utf-8'))
          if r.get('publicationEnabled') is not False:
              raise SystemExit('candidate must not publish')
          if r.get('healthy') is not True or r.get('traversalComplete') is not True:
              raise SystemExit(f'candidate unhealthy: {r.get("errors")}')
          if int(r.get('missingAfterCount') or 0) != 0:
              raise SystemExit(f'missingAfter={r.get("missingAfterCount")}')
          reports=r.get('sourceReports') or []
          if {x.get('region') for x in reports} != {'서울','경기'}:
              raise SystemExit(f'region proof incomplete: {reports}')
          if any(int(x.get('ids') or 0) <= 0 for x in reports):
              raise SystemExit(f'zero region ids: {reports}')
          jobs=json.loads(pathlib.Path('artmore_jobs.candidate.json').read_text(encoding='utf-8')).get('jobs') or []
          if not jobs:
              raise SystemExit('zero candidate jobs')
          print(json.dumps({
              'candidateJobs': len(jobs),
              'regions': [{'region':x.get('region'),'ids':x.get('ids'),'pagesVisited':x.get('pagesVisited')} for x in reports],
              'missingAfterCount': r.get('missingAfterCount'),
              'healthy': r.get('healthy'),
              'traversalComplete': r.get('traversalComplete')
          }, ensure_ascii=False, indent=2))
          PY
      - name: Validate all candidate detail links in isolated runner
        run: |
          python scripts/promote_artmore_candidate.py
          python - <<'PY'
          import json, pathlib
          r=json.loads(pathlib.Path('artmore_detail_link_report.candidate.json').read_text(encoding='utf-8'))
          if r.get('healthy') is not True or r.get('detailCoverageComplete') is not True:
              raise SystemExit(f'detail-link proof failed: {r.get("detailErrorCount")} errors')
          if int(r.get('candidateCount') or 0) != int(r.get('verifiedCount') or -1):
              raise SystemExit(f'detail coverage mismatch: {r}')
          print(json.dumps({
              'candidateCount': r.get('candidateCount'),
              'verifiedCount': r.get('verifiedCount'),
              'detailErrorCount': r.get('detailErrorCount'),
              'abnormalDrop': r.get('abnormalDrop'),
              'previousCanonicalCount': r.get('previousCanonicalCount')
          }, ensure_ascii=False, indent=2))
          PY
      - name: Upload read-only candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artmore-pr-live-proof-${{ github.run_id }}
          path: |
            artmore_jobs.candidate.json
            artmore_source_id_ledger.candidate.json
            artmore_reconciliation_report.candidate.json
            artmore_collection_state.candidate.json
            artmore_detail_link_report.candidate.json
          if-no-files-found: warn
          retention-days: 7
