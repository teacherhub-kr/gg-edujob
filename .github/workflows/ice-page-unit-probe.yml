name: ICE page-size probe (read-only)

# Diagnostic only. Tests whether ICE boards return a full lookback window on
# page 1 via a page-size parameter, avoiding the broken page-2 contract.
# Never writes production data and never counts as completeness evidence.
on:
  pull_request:
    paths:
      - 'scripts/probe_incheon_page_unit.py'
      - 'tests/test_incheon_page_unit_probe.py'
      - '.github/workflows/ice-page-unit-probe.yml'
  workflow_dispatch:
    inputs:
      page_size:
        description: 'Requested rows on page 1'
        required: false
        default: '300'
      lookback_days:
        description: 'Window that must be closed by date or displayed total'
        required: false
        default: '14'

permissions:
  contents: read

concurrency:
  group: ice-page-unit-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install collector dependencies
        run: pip install -r requirements.txt
      - name: Offline probe contract tests
        run: python -m unittest tests.test_incheon_page_unit_probe
      - name: Live read-only ICE page-size probe
        env:
          PAGE_SIZE: ${{ github.event.inputs.page_size || '300' }}
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '14' }}
        run: |
          python scripts/probe_incheon_page_unit.py \
            --page-size "$PAGE_SIZE" --lookback-days "$LOOKBACK_DAYS" \
            --report "$RUNNER_TEMP/incheon_page_unit_probe_report.json"
          git diff --exit-code -- jobs.json incheon_official_report.json
      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: incheon-page-unit-probe
          path: ${{ runner.temp }}/incheon_page_unit_probe_report.json
          if-no-files-found: warn
          retention-days: 14
