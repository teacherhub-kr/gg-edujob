name: M0 maintenance freeze audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'sources.json'
      - 'cultural_foundation_registry.json'
      - 'scripts/audit_m0_maintenance_freeze.py'
      - 'scripts/production_supervisor.py'
      - 'scripts/private_refresh_policy.py'
      - 'scripts/source_catalog.py'
      - 'scripts/source_registry.py'
      - 'scripts/private_source_registry.py'
      - 'scripts/crawl_cleaneye_foundation_jobs.py'
      - 'tests/test_production_supervisor.py'
      - 'tests/test_supervisor_blocked_official_simulation.py'
      - 'tests/test_supervisor_decision_e2e.py'
      - 'tests/test_private_refresh_policy.py'
      - 'scripts/pr_source_live_scope.py'
      - 'tests/test_private_pr_live_scope.py'
      - 'tests/test_lessoninfo_publication_dependency.py'
      - 'tests/test_source_catalog.py'
      - 'tests/test_source_onboarding_workflow.py'
      - 'tests/test_maintenance_ops_workflow.py'
      - 'tests/test_cleaneye_retry_contract.py'
      - 'tests/test_jobteacher_workflow_contract.py'
      - 'app.js'
      - 'tests/test_closed_jobs_visibility.js'
      - 'app.css'
      - 'index.html'
      - 'manifest.webmanifest'
      - 'tests/test_pwa_install_onboarding.py'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify automatic state changes remain frozen
        run: python scripts/audit_m0_maintenance_freeze.py
      - name: Verify private PR live-probe policy preserves direct source safety
        run: python -m unittest tests.test_private_pr_live_scope
      - name: Verify active recruitment cards expire at KST cutoff
        run: |
          node --check app.js
          node tests/test_closed_jobs_visibility.js
      - name: Verify CleanEye bounded bootstrap retry
        run: python -m unittest tests.test_cleaneye_retry_contract
      - name: Verify JobTeacher publication is fail-closed
        run: python -m unittest tests.test_jobteacher_workflow_contract
      - name: Verify canonical metropolitan source catalog
        run: |
          python scripts/source_catalog.py --validate
          python -m unittest tests.test_source_catalog
      - name: Verify source-onboarding consolidation contract
        run: python -m unittest tests.test_source_onboarding_workflow
      - name: Verify maintenance-operations consolidation contract
        run: python -m unittest tests.test_maintenance_ops_workflow
      - name: Verify unattended supervisor safety logic
        run: |
          python -m unittest tests.test_production_supervisor
          python -m unittest tests.test_supervisor_blocked_official_simulation
          python -m unittest tests.test_supervisor_decision_e2e
          python -m unittest tests.test_private_refresh_policy
          python -m unittest tests.test_lessoninfo_publication_dependency
      - name: Verify snapshot-bound completeness logic
        run: python -m unittest tests.test_verify_published_scan_completeness
      - name: Verify PWA install onboarding contract
        run: |
          node --check app.js
          python -m unittest tests.test_pwa_install_onboarding