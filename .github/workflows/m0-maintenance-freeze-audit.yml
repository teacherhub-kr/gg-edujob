name: M0 maintenance freeze audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/audit_m0_maintenance_freeze.py'
      - 'scripts/production_supervisor.py'
      - 'tests/test_production_supervisor.py'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify automatic state changes remain frozen
        run: python scripts/audit_m0_maintenance_freeze.py
      - name: Verify unattended supervisor safety logic
        run: python -m unittest tests.test_production_supervisor
