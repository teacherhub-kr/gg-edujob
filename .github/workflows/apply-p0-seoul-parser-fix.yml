name: Apply P0 Seoul parser fix (branch only)

on:
  push:
    branches:
      - fix/seoul-support-subject-parser-20261004

permissions:
  contents: write

concurrency:
  group: p0-seoul-parser-fix-branch
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref == 'refs/heads/fix/seoul-support-subject-parser-20261004'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/seoul-support-subject-parser-20261004
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Apply exact branch-only patch
        run: python scripts/apply_p0_seoul_parser_fix.py
      - name: Compile changed collectors
        run: python -m py_compile scripts/scrape_jobs.py scripts/complete_support_coverage.py scripts/seoul_support_detail_metadata.py
      - name: Run Seoul support regressions
        run: |
          python -m unittest discover -s tests -p test_seoul_support_exact_detail_metadata.py
          python -m unittest discover -s tests -p test_seoul_support_subject_row_parser.py
      - name: Remove temporary patch machinery
        run: |
          git rm scripts/apply_p0_seoul_parser_fix.py
          git rm .github/workflows/apply-p0-seoul-parser-fix.yml
      - name: Commit reviewed target changes to fix branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/scrape_jobs.py scripts/complete_support_coverage.py .github/workflows/seoul-office-row-parser-regression.yml tests/test_seoul_support_subject_row_parser.py
          git diff --cached --check
          git diff --cached --quiet && { echo 'No target changes generated' >&2; exit 1; }
          git commit -m 'Fix Seoul support subject-row parsing blind spot'
          git push origin HEAD:fix/seoul-support-subject-parser-20261004
