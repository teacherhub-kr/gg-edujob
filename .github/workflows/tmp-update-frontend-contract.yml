name: Temporary frontend-contract update

on:
  push:
    branches:
      - fix/scoped-region-and-source-tabs-20261005

permissions:
  contents: write

jobs:
  update-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/scoped-region-and-source-tabs-20261005
          fetch-depth: 0
      - name: Align frontend contract with scoped region and feedKind behavior
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/test_app_frontend_contract.py')
          s=p.read_text(encoding='utf-8')
          old='    "sourceSurfaceLabel",\n'
          new='    "surface:j.feedKind===\'private\'?\'민간공고\':\'공식공고\'",\n'
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('frontend contract source marker missing')
          anchor='    "selectedSummaryHtml",\n'
          extras='    "regionToken",\n    "regionSelectionMatches",\n'
          if extras not in s:
              if anchor not in s:
                  raise SystemExit('filter contract insertion point missing')
              s=s.replace(anchor,anchor+extras,1)
          s=s.replace('app.js?v=20260926pwa3','app.js?v=20261005filter1')
          p.write_text(s,encoding='utf-8')
          PY
          python tests/test_app_frontend_contract.py
          python -m unittest tests.test_pwa_install_onboarding
          node --check app.js
      - name: Remove temporary workflow and commit contract update
        shell: bash
        run: |
          rm -f .github/workflows/tmp-update-frontend-contract.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_app_frontend_contract.py .github/workflows/tmp-update-frontend-contract.yml
          if git diff --cached --quiet; then
            echo "No contract changes needed"
            exit 0
          fi
          git commit -m "Align frontend contract with scoped region filters"
          git push origin HEAD:fix/scoped-region-and-source-tabs-20261005
