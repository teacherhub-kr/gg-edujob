name: Frontend rebuild preview

on:
  pull_request:
    paths:
      - 'index.html'
      - 'app.html'
      - 'app.css'
      - 'app.js'
      - 'user-store.js'
      - 'tests/test_app_frontend_contract.py'
      - '.github/workflows/frontend-rebuild-preview.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Verify isolated frontend contract
        run: python tests/test_app_frontend_contract.py
      - name: Verify production app shell
        run: |
          grep -q 'id="appHeader"' index.html
          grep -q 'app.css?v=20260923pwa1' index.html
          grep -q 'app.js?v=20260923pwa1' index.html
          grep -q 'manifest.webmanifest' index.html
          ! grep -q 'edujob-final-ui' index.html
          ! grep -q 'mobile-ui.js' index.html
          test -f app.html
