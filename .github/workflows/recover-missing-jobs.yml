name: Recover missing 수도권 education jobs

on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write

# The recovery workflow performs long network scans before it is ready to publish.
# Keep those scans serialized with each other, but do not hold the shared data-writer
# queue for hours. Publication below is optimistic/non-force: it re-checks origin/main
# against the captured baseline, discards on unsafe concurrent changes, and discards
# again if the final push loses a race. This lets hourly reconciliation create fresh
# proof windows without weakening last-known-good publication guards.
concurrency:
  group: metro-edujob-recovery-scan
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Synchronize latest main after any queue delay
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          git rev-parse HEAD >/tmp/recovery_base_sha
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Preserve current verified publication
        run: |
          python scripts/update_collector_status.py --workflow recovery --stage baseline --state running
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('jobs.json').read_text(encoding='utf-8'))
          jobs=d.get('jobs',[]) if isinstance(d,dict) else []
          if len(jobs)<100: raise SystemExit(f'Unsafe recovery baseline: {len(jobs)} jobs')
          PY
          cp jobs.json /tmp/jobs_recovery_base.json

      - name: Verify collectors are already hardened and immutable
        shell: bash
        run: |
          set -euo pipefail
          # Recovery validates stable production contracts and then proves pagination,
          # reconciliation, exact links and regional completeness through executable
          # validators below. Do not bind this gate to implementation-source strings.
          python -m py_compile scripts/scrape_jobs.py scripts/repair_gyeonggi_support.py scripts/complete_support_coverage.py scripts/reconcile_source_ids.py scripts/verify_central_pagination.py scripts/verify_gyeonggi_central_90d.py scripts/verify_central_reconciliation_consistency.py scripts/merge_recovery_snapshot.py scripts/resolve_support_links.py scripts/enrich_support_periods.py scripts/enrich_seoul_get_fallback.py scripts/verify_support_completeness.py scripts/verify_jobs.py scripts/update_collection_state.py scripts/update_collector_status.py scripts/sync_effective_audit_status.py scripts/sanitize_job_dates.py scripts/merge_incheon_official.py scripts/collect_incheon_support.py scripts/verify_required_regions.py
          grep -q 'coverageComplete' scripts/complete_support_coverage.py
          git diff --exit-code -- scripts

      - name: Prove central portal pagination independently
        run: python scripts/verify_central_pagination.py

      - name: Fresh crawl of central portals and support offices
        run: python scripts/scrape_jobs.py

      - name: Re-check Gyeonggi support-office boards
        run: python scripts/repair_gyeonggi_support.py

      - name: Gap audit pass 1 through recent 90-day boundary
        run: python scripts/complete_support_coverage.py

      - name: Gap audit pass 2 after transient-failure delay
        run: |
          sleep 12
          python scripts/complete_support_coverage.py

      - name: Collect complete Incheon official network
        run: |
          python scripts/merge_incheon_official.py --lookback-days 90 --transient-retries 2 --retry-delay-seconds 15
          python scripts/collect_incheon_support.py --lookback-days 90

      - name: Refresh independent Gyeonggi 90-day proof in current audit window
        run: python scripts/verify_gyeonggi_central_90d.py

      - name: Reconcile official posting IDs and recover exact missing source occurrences
        run: python scripts/reconcile_source_ids.py

      - name: Re-prove central IDs and require independent agreement
        run: |
          python scripts/verify_central_pagination.py
          python scripts/verify_central_reconciliation_consistency.py

      - name: Sanitize impossible registration dates
        run: python scripts/sanitize_job_dates.py

      - name: Merge fresh snapshot with previously published active postings
        run: python scripts/merge_recovery_snapshot.py --previous /tmp/jobs_recovery_base.json --report missing_recovery_report.json

      - name: Resolve exact links and periods
        run: |
          python scripts/resolve_support_links.py
          python scripts/enrich_support_periods.py
          python scripts/enrich_seoul_get_fallback.py

      - name: Require proven support-office traversal and exact links
        run: python scripts/verify_support_completeness.py

      - name: Require all three official regions in the candidate dataset
        run: python scripts/verify_required_regions.py

      - name: Validate recovered dataset against published baseline
        run: python scripts/verify_jobs.py --previous /tmp/jobs_recovery_base.json

      - name: Persist append-only recruitment ledger and checkpoints
        run: python scripts/update_collection_state.py

      - name: Recovery loss guard
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from source_registry import official_source_count

          before=json.loads(Path('/tmp/jobs_recovery_base.json').read_text(encoding='utf-8')).get('jobs',[])
          after=json.loads(Path('jobs.json').read_text(encoding='utf-8')).get('jobs',[])
          rec=json.loads(Path('source_reconciliation_report.json').read_text(encoding='utf-8'))
          summary=rec.get('summary',{})
          central=json.loads(Path('central_pagination_report.json').read_text(encoding='utf-8'))
          expected_sources=official_source_count()
          if len(after)<100: raise SystemExit(f'Recovery output too small: {len(after)}')
          if len(before)>=100 and len(after)<len(before)*0.70:
              raise SystemExit(f'Recovery unexpectedly lost >30%: {len(before)} -> {len(after)}')
          if int(summary.get('missingAfter') or 0) != 0:
              raise SystemExit(f'Official ID reconciliation still missing {summary.get("missingAfter")} postings')
          reconciled=int(summary.get('reconciledSources') or 0)
          total=int(summary.get('totalSources') or 0)
          if total != expected_sources or reconciled != total:
              raise SystemExit(
                  f'Not all registered official sources reconciled: expected={expected_sources}, summary={summary}'
              )
          if not central.get('complete'):
              raise SystemExit(f'Central pagination proof incomplete: {central}')
          sources=central.get('sources') or []
          if len(sources) != 2 or any(not s.get('complete') for s in sources):
              raise SystemExit(f'Gyeonggi/Seoul central sources must independently prove pagination: {sources}')
          print(f'Recovery guard passed: {len(before)} -> {len(after)}; registry sources={expected_sources}; official IDs={summary.get("officialIdCount")}, recovered={summary.get("recoveredNow")}; central pagination complete')
          PY
          python scripts/verify_central_reconciliation_consistency.py
          python scripts/verify_required_regions.py
          python scripts/update_collector_status.py --workflow recovery --stage complete --state success
          python scripts/sync_effective_audit_status.py

      - name: Commit only verified recovered data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          rm -f recovery_failure_report.json
          # Recovery is a data workflow. Source/config files are deliberately excluded: any
          # collector hardening or registry change must arrive through a reviewed code change.
          git add jobs.json job_ledger.json source_id_ledger.json collection_state.json collector_status.json deep_audit_status.json board_cache.json missing_recovery_report.json source_reconciliation_report.json central_pagination_report.json gyeonggi_central_90d_report.json date_anomaly_report.json support_coverage_report.json support_link_resolution.json support_period_cache.json incheon_official_report.json incheon_support_report.json
          git ls-files --error-unmatch recovery_failure_report.json >/dev/null 2>&1 && git add -u -- recovery_failure_report.json || true
          git diff --cached --quiet && exit 0
          python scripts/publication_transaction.py publish \
            --baseline-file /tmp/recovery_base_sha \
            --status-file /tmp/recovery-publication-transaction.json \
            --message 'Recover and reconcile official recruitment posting IDs' \
            --allow-concurrent-path operational_quality_report.json \
            --allow-concurrent-path operational_quality_history.json \
            --revalidate-command 'python scripts/verify_jobs.py --previous /tmp/jobs_recovery_base.json && python scripts/validate_reconciliation_policy.py && python scripts/verify_central_reconciliation_consistency.py && python scripts/verify_required_regions.py'


      - name: Dispatch unified publication when canonical jobs advanced
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main
          jobs_ts="$(git log -1 --format=%ct origin/main -- jobs.json || true)"
          unified_ts="$(git log -1 --format=%ct origin/main -- unified_jobs.json || true)"
          if [ -z "$jobs_ts" ]; then
            echo "No canonical jobs.json commit found; refusing follow-up dispatch."
            exit 1
          fi
          if [ -n "$unified_ts" ] && [ "$jobs_ts" -le "$unified_ts" ]; then
            echo "Unified publication is already current."
            exit 0
          fi
          active="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/unified-search.yml/runs?per_page=10" \
            --jq '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress")] | length')"
          if [ "${active:-0}" -gt 0 ]; then
            echo "Unified publication already queued/in progress; skipping duplicate dispatch."
            exit 0
          fi
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/unified-search.yml/dispatches" \
            -f ref=main
          echo "Dispatched unified publication immediately after verified data publication."

      - name: Preserve failed recovery diagnostics without publishing unverified data
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/recovery-diagnostics
          for f in support_coverage_report.json support_link_resolution.json source_reconciliation_report.json source_id_ledger.json central_pagination_report.json gyeonggi_central_90d_report.json missing_recovery_report.json date_anomaly_report.json incheon_official_report.json incheon_support_report.json; do
            if [ -f "$f" ]; then cp "$f" "/tmp/recovery-diagnostics/$f"; fi
          done

          # A failed candidate must never replace canonical evidence. Also recover from any
          # interrupted rebase/detached HEAD before recording the isolated diagnostic.
          git rebase --abort >/dev/null 2>&1 || true
          git fetch origin main
          git checkout -B main origin/main
          git clean -fd
          python - <<'PY'
          import json
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          src = Path('/tmp/recovery-diagnostics')
          def load(name):
              p = src / name
              if not p.exists():
                  return None
              try:
                  return json.loads(p.read_text(encoding='utf-8'))
              except Exception as e:
                  return {'readError': type(e).__name__}

          rec = load('source_reconciliation_report.json')
          ledger = load('source_id_ledger.json')
          central = load('central_pagination_report.json')
          gyeonggi90 = load('gyeonggi_central_90d_report.json')
          coverage = load('support_coverage_report.json')
          links = load('support_link_resolution.json')
          missing = load('missing_recovery_report.json')
          dates = load('date_anomaly_report.json')
          incheon = load('incheon_official_report.json')

          report = {
              'generatedAt': datetime.now(timezone(timedelta(hours=9))).strftime('%Y-%m-%d %H:%M:%S KST'),
              'policy': 'failed recovery candidate evidence is isolated; canonical jobs/evidence remain last-known-good',
              'sourceReconciliationSummary': (rec or {}).get('summary') if isinstance(rec, dict) else None,
              'sourceIdLedger': {
                  'generatedAt': (ledger or {}).get('generatedAt'),
                  'knownIdCount': len((ledger or {}).get('entries') or {}) if isinstance(ledger, dict) else None,
              },
              'centralPagination': {
                  'generatedAt': (central or {}).get('generatedAt'),
                  'complete': (central or {}).get('complete'),
                  'sources': (central or {}).get('sources'),
              } if isinstance(central, dict) else None,
              'gyeonggiCentral90d': {
                  'generatedAt': (gyeonggi90 or {}).get('generatedAt'),
                  'complete': (gyeonggi90 or {}).get('complete'),
                  'stableIdCount': (gyeonggi90 or {}).get('stableIdCount'),
                  'categories': (gyeonggi90 or {}).get('categories'),
              } if isinstance(gyeonggi90, dict) else None,
              'incheonOfficial': {
                  'generatedAt': (incheon or {}).get('generatedAt'),
                  'coverageComplete': (incheon or {}).get('coverageComplete'),
                  'boardHealth': (incheon or {}).get('boardHealth'),
              } if isinstance(incheon, dict) else None,
              'supportCoverageSummary': (coverage or {}).get('summary') if isinstance(coverage, dict) else None,
              'supportCompleteness': (coverage or {}).get('supportCompleteness') if isinstance(coverage, dict) else None,
              'supportLinkResolution': {
                  'gyeonggi': (links or {}).get('gyeonggi'),
                  'seoul': (links or {}).get('seoul'),
              } if isinstance(links, dict) else None,
              'missingRecoverySummary': (missing or {}).get('summary') if isinstance(missing, dict) else None,
              'dateAnomalySummary': (dates or {}).get('summary') if isinstance(dates, dict) else None,
          }
          Path('recovery_failure_report.json').write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

          python scripts/update_collector_status.py --workflow recovery --stage recovery --state failed
          cp collector_status.json /tmp/recovery-diagnostics/collector_status.json
          cp recovery_failure_report.json /tmp/recovery-diagnostics/recovery_failure_report.json
          [ ! -f /tmp/recovery-publication-transaction.json ] || cp /tmp/recovery-publication-transaction.json /tmp/recovery-diagnostics/publication_transaction.json
      - name: Upload isolated recovery diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/recovery-diagnostics
          if-no-files-found: warn
          retention-days: 14
      - name: Upload recovery publication transaction status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/recovery-publication-transaction.json
          if-no-files-found: warn
          retention-days: 14
