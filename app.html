<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#EFF5FF">
  <title>수도권에듀잡</title>
  <meta name="description" content="서울·경기·인천 교육 채용공고 통합 검색">
  <link rel="icon" href="edujob-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="app.css?v=20260919b">
</head>
<body>
  <a class="skip-link" href="#appMain">본문 바로가기</a>

  <header class="app-header" id="appHeader">
    <div class="header-inner">
      <a class="brand" href="#/home" aria-label="수도권에듀잡 홈">
        <img src="edujob-logo.svg?v=20260919g" width="48" height="48" alt="">
        <span class="brand-copy"><strong>수도권<span>에듀잡</span></strong><small>좋은 선생님이, 더 좋은 교육을 만듭니다</small></span>
      </a>
      <div class="header-actions">
        <button type="button" id="headerAlertBtn" class="icon-btn" aria-label="알림 설정"></button>
        <button type="button" id="headerMenuBtn" class="icon-btn" aria-label="마이페이지"></button>
      </div>
    </div>
  </header>

  <main id="appMain" class="app-shell" tabindex="-1">
    <section id="searchTop" class="search-top" aria-label="채용공고 검색">
      <form id="searchForm" class="search-bar" role="search">
        <span class="search-icon" aria-hidden="true"></span>
        <input id="searchInput" type="search" autocomplete="off" placeholder="지역, 학교, 과목, 직종으로 검색하세요">
        <button id="searchClear" class="search-clear" type="button" aria-label="검색어 지우기">×</button>
        <button class="search-submit" type="submit">검색</button>
      </form>
      <div id="surfaceSegment" class="surface-segment" role="group" aria-label="구인 유형">
        <button type="button" data-surface="" class="active">전체 구인</button>
        <button type="button" data-surface="학교·교육청">학교·교육청</button>
        <button type="button" data-surface="학원·민간">학원·민간</button>
      </div>
    </section>

    <div id="screen" class="screen" aria-live="polite"></div>
  </main>

  <nav id="bottomNav" class="bottom-nav" aria-label="주요 메뉴">
    <a href="#/home" data-route="home"><span data-icon="home"></span><b>홈</b></a>
    <a href="#/search" data-route="search"><span data-icon="search"></span><b>공고검색</b></a>
    <a href="#/radar" data-route="radar"><span data-icon="radar"></span><b>내 채용 레이더</b></a>
    <a href="#/saved" data-route="saved"><span data-icon="heart"></span><b>관심공고</b></a>
    <a href="#/me" data-route="me"><span data-icon="user"></span><b>마이페이지</b></a>
  </nav>

  <div class="integration-hooks" aria-hidden="true">
    <div class="job-radar-actions"></div>
    <div id="jobRadarCopy"></div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="user-store.js?v=20260919b" defer></script>
  <script src="alert-config.js?v=20260918a" defer></script>
  <script src="app.js?v=20260919b" defer></script>
  <script src="direct-link-guard.js?v=20260907c" defer></script>
  <script src="alert-client.js?v=20260918a" defer></script>
</body>
</html>
