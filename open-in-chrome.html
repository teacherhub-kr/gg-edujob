<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>수도권에듀잡 - Chrome에서 열기</title>
  <meta name="robots" content="noindex">
  <style>
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;background:#f5f8fc;color:#1f2d3d}
    main{max-width:520px;margin:0 auto;padding:44px 20px;text-align:center}
    .card{background:#fff;border:1px solid #dfe7f1;border-radius:18px;padding:26px 20px;box-shadow:0 8px 24px rgba(31,45,61,.06)}
    h1{font-size:21px;margin:0 0 9px}p{font-size:14px;line-height:1.6;color:#607086;margin:0 0 18px}
    button,a{display:block;width:100%;box-sizing:border-box;border-radius:12px;padding:13px 14px;font-size:15px;font-weight:800;text-decoration:none}
    button{border:0;background:#2f76d2;color:#fff;margin-bottom:9px}
    a{border:1px solid #cfdae8;background:#fff;color:#365b83}
  </style>
</head>
<body>
<main><div class="card">
  <h1>Chrome에서 수도권에듀잡 열기</h1>
  <p>웹 푸시 알림을 사용하려면 Chrome에서 수도권에듀잡을 열어주세요.</p>
  <button id="openChrome" type="button">Chrome에서 열기</button>
  <a href="https://teacherhub-kr.github.io/gg-edujob/">일반 주소로 열기</a>
</div></main>
<script>
(()=>{
  const target='https://teacherhub-kr.github.io/gg-edujob/';
  const intent='intent://teacherhub-kr.github.io/gg-edujob/#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url='+encodeURIComponent(target)+';end';
  const open=()=>{location.href=intent};
  document.getElementById('openChrome').addEventListener('click',open);
  setTimeout(open,250);
})();
</script>
</body>
</html>
